[project]
name = "enigma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
enigma = "enigma:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
